<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat Thief</title>

<!--
  The window's face. Everything it can do goes through pywebview.api, which
  is gui.py's Api object - see gui.py for what each call does.

  Designed as a piece of hardware rather than a web page: this sits open next
  to Ableton, so it borrows a sampler's vocabulary - silkscreen section
  labels, pads that light when armed, one big readout. Set in Avenir Next,
  which is round and humanist where a monospace would be square, and which
  ships with macOS so nothing is ever fetched over the network.

  The readout is the point of the whole app. While a run is going it shows
  progress; when it finishes it shows the tempo that got baked into the
  filename, big enough to read across a desk and clickable to copy - because
  that number is what gets typed into Ableton next.
-->

<style>
  :root {
    --panel: #16171b;
    --raised: #1e2026;
    --edge: #2c2f37;
    --ink: #e9e7e2;
    --dim: #8b8d95;
    --violet: #a78bfa;
    --violet-dim: #38265f;
    --good: #5fd39a;
    --bad: #ff6b5e;
    --radius: 6px;

    --display: "Avenir Next", "Avenir", -apple-system, sans-serif;
    --ui: "Avenir Next", "Avenir", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: var(--panel);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  /* Silkscreen labels, the way a panel names its sections. */
  .label {
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 0 0 8px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 22px 15px;
    border-bottom: 1px solid var(--edge);
  }

  .wordmark { display: flex; align-items: center; gap: 10px; }

  h1 {
    font-family: var(--display);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.005em;
    margin: 0;
  }

  #state {
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 7px;
  }

  #led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--edge);
    flex: none;
  }
  body[data-state="running"] #led { background: var(--violet); animation: pulse 1.4s ease-in-out infinite; }
  body[data-state="done"] #led { background: var(--good); }
  body[data-state="error"] #led,
  body[data-state="cancelled"] #led { background: var(--bad); }
  body[data-state="running"] #state { color: var(--violet); }
  body[data-state="error"] #state { color: var(--bad); }

  @keyframes pulse { 50% { opacity: 0.25; } }

  main {
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    flex: none;
  }

  input[type="url"] {
    width: 100%;
    padding: 11px 13px;
    background: #0f1013;
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: var(--display);
    font-size: 12.5px;
    user-select: text;
    cursor: text;
  }
  input[type="url"]::placeholder { color: #5b5d64; }
  input[type="url"]:focus {
    outline: none;
    border-color: var(--violet);
    box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.16);
  }

  /* Armed pads: on or off at a glance, no hunting for a tick mark. */
  .pads { display: flex; gap: 8px; }

  .pad {
    flex: 1;
    padding: 13px 6px 11px;
    background: var(--raised);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    color: var(--dim);
    font-family: var(--display);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: center;
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .pad:hover { border-color: #3d414b; }
  .pad[aria-pressed="true"] {
    background: var(--violet-dim);
    border-color: var(--violet);
    color: var(--violet);
  }
  /* Already in the stash. Not a state you can click into or out of - the
     only way to clear it is to delete the file - so it doesn't respond to
     hover and doesn't take the armed colour. */
  .pad[data-have="true"] {
    background: rgba(95, 211, 154, 0.12);
    border-color: var(--good);
    color: var(--good);
    cursor: default;
  }
  /* Except a beat, which is the one thing worth having more than one of: a
     green Beat can be armed for another, and armed beats green. */
  .pad[data-again="true"] { cursor: pointer; }
  .pad[data-have="true"][aria-pressed="true"] {
    background: var(--violet-dim);
    border-color: var(--violet);
    color: var(--violet);
  }
  /* Armed only because something armed above it is made out of it. Purple
     like anything armed, but not yours to turn off while that thing is on -
     so it doesn't take the hover, which is what invites the click. */
  .pad[data-locked="true"] { cursor: default; }
  .pad[data-locked="true"]:hover { border-color: var(--violet); }
  .pad:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  .extras {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    margin-top: 11px;
    font-size: 12.5px;
    color: var(--dim);
  }
  .extras label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .extras input { accent-color: var(--violet); margin: 0; }
  .extras .aside { color: #5b5d64; }

  /* The readout: progress while working, tempo when finished. */
  .readout {
    background: #0d0e11;
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    padding: 22px 18px 18px;
    text-align: center;
  }

  #figure {
    font-family: var(--display);
    font-size: 46px;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1;
    color: #4a4d55;
    font-variant-numeric: tabular-nums;
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
  }
  body[data-state="running"] #figure { color: var(--violet); }
  body[data-state="done"] #figure { color: var(--good); }
  body[data-state="error"] #figure,
  body[data-state="cancelled"] #figure { color: var(--bad); }

  #figure[data-copyable="true"] { cursor: pointer; }
  #figure[data-copyable="true"]:hover { background: rgba(95, 211, 154, 0.1); }

  #unit {
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
    margin-top: 9px;
  }

  #message {
    font-size: 12.5px;
    color: var(--dim);
    margin-top: 13px;
    min-height: 1.45em;
    word-break: break-word;
  }
  body[data-state="error"] #message { color: var(--bad); }

  .track {
    height: 3px;
    background: var(--edge);
    border-radius: 2px;
    margin-top: 14px;
    overflow: hidden;
  }
  #bar {
    height: 100%;
    width: 0;
    background: var(--violet);
    transition: width 0.25s linear;
  }
  body[data-state="done"] #bar { background: var(--good); }

  /* Two separate stalls, both measured on a real run, both of which used to
     look identical to a crash:

       - 48s between "isolating" and demucs' first percentage, which is
         torch loading and the model coming off disk. No percentage exists
         to show, so the bar was pinned at zero width the whole time.
       - 28s sitting between 61% and 63% mid-separation. The percentage is
         honest - demucs just isn't linear in time - so even a correct bar
         stops dead.

     So the bar carries a travelling sheen whenever a run is going,
     independent of its width. Movement means "alive", width means
     "progress", and they're no longer the same claim. */
  #bar::after {
    content: "";
    display: block;
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
    transform: translateX(-100%);
  }
  body[data-state="running"] #bar::after { animation: sheen 1.6s ease-in-out infinite; }

  /* With no percentage to show, the track fills itself and lets the sheen
     do all the talking rather than claiming a width it hasn't earned. */
  #bar[data-indeterminate="true"] {
    width: 100%;
    background: var(--violet-dim);
    transition: none;
  }
  #bar[data-indeterminate="true"]::after {
    background: linear-gradient(90deg, transparent, var(--violet), transparent);
    width: 40%;
  }
  body[data-state="running"] #bar[data-indeterminate="true"]::after { animation: sweep 1.5s ease-in-out infinite; }

  @keyframes sheen { to { transform: translateX(100%); } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(350%); } }

  #go {
    width: 100%;
    padding: 14px;
    background: var(--violet);
    border: none;
    border-radius: var(--radius);
    color: #14102a;
    font-family: var(--display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
  }
  #go:hover { background: #b9a1fb; }
  #go:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #go[data-mode="cancel"] {
    background: transparent;
    border: 1px solid var(--bad);
    color: var(--bad);
  }
  #go[data-mode="cancel"]:hover { background: rgba(255, 107, 94, 0.12); }
  #go:disabled { opacity: 0.45; cursor: default; }

  /* The one part of the page that scrolls: the header and the Take/readout
     section above it stay put at their natural size, so a long session of
     stolen songs pushes the file list, never the controls, off screen. */
  .files {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    border-top: 1px solid var(--edge);
    padding: 18px 22px 22px;
  }

  #empty { color: #5b5d64; font-size: 12.5px; margin: 0 0 12px; }

  /* Outside .files and last in the DOM, so it stays pinned to the bottom of
     the window instead of scrolling away under a long file list. The
     folder is the one thing you always want to reach - it's where every
     previous session's work is too, and an empty list used to be a dead
     end that told you where your files were without offering to show you. */
  #destination {
    flex: none;
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    margin: 0;
    padding: 12px 22px;
    background: var(--panel);
    border: none;
    border-top: 1px solid var(--edge);
    color: #4a4d55;
    font-family: var(--display);
    font-size: 10px;
    text-align: left;
    cursor: pointer;
  }
  #destination:hover { color: var(--violet); }
  #destination:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
  #destination .where {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl;  /* keep the folder name visible when the path is long */
    text-align: left;
  }
  #destination .open {
    flex: none;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  #destination:hover .open { color: var(--violet); }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

  /* One row per song, not per file. A song's stems all live in the same
     folder and all get dragged out of it together, so the folder is the
     thing worth reaching - a list of every wav inside it was four rows of
     noise for one answer. */
  .song {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--raised);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
  }
  .song:hover { border-color: #3d414b; }

  .song-open {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 9px;
    background: none;
    border: none;
    padding: 0;
    color: var(--ink);
    font-family: var(--display);
    font-size: 11.5px;
    text-align: left;
    cursor: pointer;
  }
  .song-open:hover .song-title { color: var(--violet); }
  .song-open:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }

  .song-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .song-meta {
    flex: none;
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  /* The same six things as the Take section, in the same order, so a
     glance down the list and a glance up at the pads mean the same thing.
     Green is in the stash; clicking one reveals that exact file. */
  .marks { display: flex; gap: 3px; flex: none; }
  .mark {
    width: 13px;
    height: 13px;
    padding: 0;
    border-radius: 3px;
    background: transparent;
    border: 1px solid var(--edge);
    cursor: default;
  }
  .mark[data-have="true"] {
    background: var(--good);
    border-color: var(--good);
    cursor: pointer;
  }
  .mark[data-have="true"]:hover { background: #8ce7bd; }
  .mark:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  .again {
    flex: none;
    padding: 5px 10px;
    background: transparent;
    border: 1px solid var(--violet);
    border-radius: 4px;
    color: var(--violet);
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .again:hover { background: var(--violet-dim); }
  .again:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  /* The picker. A beat is found by ear, so this is built to be listened
     to: the waveform is there to get you near the phrase, not to be read
     precisely. Everything precise happens in the transcription after. */
  .picker {
    margin-top: 10px;
    padding: 12px;
    background: #0d0e11;
    border: 1px solid var(--edge);
    border-radius: var(--radius);
  }
  .picker[hidden] { display: none; }

  .picker-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
  }
  #picker-hint { color: #5b5d64; letter-spacing: 0.04em; text-transform: none; font-size: 11px; }

  #wave {
    display: block;
    width: 100%;
    height: 78px;
    background: #0a0b0d;
    border-radius: 4px;
    cursor: crosshair;
  }

  /* The zoomed strip, where the grid actually fits. #wave draws the whole
     song across about 900px, so at 105 BPM a six-minute stem gets 1.4px per
     beat - lines there would be a grey wash, not a grid. This shows a few
     bars either side of where you are, which is the only span at which "am
     I on the one" is a question a drawing can answer. */
  #detail {
    display: block;
    width: 100%;
    height: 52px;
    margin-top: 6px;
    background: #0a0b0d;
    border-radius: 4px;
    cursor: crosshair;
  }

  .picker-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .picker-controls button {
    padding: 8px 14px;
    background: var(--raised);
    border: 1px solid var(--edge);
    border-radius: 4px;
    color: var(--ink);
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .picker-controls button:hover { border-color: var(--violet); color: var(--violet); }
  .picker-controls button:disabled { opacity: 0.4; cursor: default; border-color: var(--edge); color: var(--dim); }
  /* The one thing in here that writes a file, so it's the one that's lit. */
  #build { border-color: var(--violet); color: var(--violet); }
  #build:hover { background: var(--violet-dim); }

  /* How long you've held the section for. Pushed to the right with the
     clock, and violet because it's the thing you're deciding. */
  #marked {
    margin-left: auto;
    font-family: var(--display);
    font-size: 11px;
    color: var(--violet);
    font-variant-numeric: tabular-nums;
  }
  #clock {
    margin-left: 0;
    font-family: var(--display);
    font-size: 11px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<body data-state="idle">
  <header>
    <div class="wordmark">
      <img src="logo.svg" alt="" width="26" height="26">
      <h1>Beat Thief</h1>
    </div>
    <div id="state"><span id="led"></span><span id="state-text">Ready</span></div>
  </header>

  <main>
    <section>
      <p class="label">Link</p>
      <input id="url" type="url" placeholder="paste a YouTube or YouTube Music link" spellcheck="false" autofocus>
    </section>

    <section>
      <p class="label">Take</p>
      <!--
        Seven things, in the order they're shown everywhere: Song, Drums,
        Beat, Midi, Bass, Harmony, Vocals. Grey means not armed, purple means
        armed for this run, green means it's already in the stash - and
        green can only be cleared by deleting the file, never by clicking.
      -->
      <div class="pads">
        <button class="pad" id="pad-song" data-stem="song" aria-pressed="true">Song</button>
        <button class="pad" id="pad-drums" data-stem="drums" aria-pressed="false">Drums</button>
        <button class="pad" id="pad-beat" data-stem="beat" data-again="true" aria-pressed="false">Beat</button>
        <button class="pad" id="pad-midi" data-stem="midi" data-again="true" aria-pressed="false">Midi</button>
        <button class="pad" id="pad-bass" data-stem="bass" aria-pressed="false">Bass</button>
        <button class="pad" id="pad-harmony" data-stem="harmony" aria-pressed="false">Harmony</button>
        <button class="pad" id="pad-vocals" data-stem="vocals" aria-pressed="false">Vocals</button>
      </div>
      <div class="extras">
        <span class="aside" id="take-note">All four stems rebuild the song.</span>
      </div>
    </section>

    <section class="readout" id="readout">
      <div id="figure" data-copyable="false">···</div>
      <div id="unit"></div>
      <p id="message">Paste a link to get started.</p>
      <div class="track"><div id="bar"></div></div>
    </section>

    <!--
      The picker takes the readout's place rather than sitting below it.
      Marking a section is a whole task on its own - while you're doing it
      the tempo, the progress bar and Steal it are all about a run that has
      already finished, and having them there just invites the wrong click.
    -->
    <section class="picker" id="picker" hidden>
      <div class="picker-head">
        <span id="picker-title">Steal a beat</span>
        <span id="picker-hint">Click at the 1 of the phrase — ← → a sixteenth, ⇧ a beat — space at the next 1.</span>
      </div>
      <canvas id="wave" width="1000" height="156"></canvas>
      <canvas id="detail" width="1000" height="104"></canvas>
      <div class="picker-controls">
        <button id="play" type="button">Play</button>
        <button id="build" type="button" disabled>Build</button>
        <button id="picker-close" type="button">Close</button>
        <span id="marked"></span>
        <span id="clock">0:00</span>
      </div>
    </section>

    <button id="go">Steal it</button>
  </main>

  <section class="files">
    <p class="label">Files</p>
    <p id="empty">Nothing yet this session.</p>
    <ul id="outputs"></ul>
  </section>

  <!--
    Outside .files and last in the DOM, so it stays pinned to the bottom of
    the window instead of scrolling away under a long file list - the
    folder is the one thing you always want to reach, whether or not this
    session downloaded anything (see the #destination rule below).
  -->
  <button id="destination" type="button" title="Open this folder in Finder">
    <span class="where"></span><span class="open">Open</span>
  </button>

<script>
  const el = (id) => document.getElementById(id);
  const body = document.body;

  let polling = null;
  let running = false;

  // --- reading a run's state -------------------------------------------

  // The tempo lives in the filename ("... at 121.132 BPM).wav") because that's
  // where the pipeline puts it. Pulling it back out is what lets the readout
  // finish on the number worth knowing rather than a bare "100%".
  const TEMPO = /at ([\d.]+) BPM\)/;

  function tempoOf(paths) {
    for (const path of paths) {
      const found = path.match(TEMPO);
      if (found) return found[1];
    }
    return null;
  }

  // --- painting ---------------------------------------------------------

  function setFigure(text, unit, copyable) {
    el("figure").textContent = text;
    el("figure").dataset.copyable = copyable ? "true" : "false";
    el("unit").textContent = unit;
  }

  function render(state) {
    running = state.running;
    const mode = state.error ? "error" : state.running ? "running" : state.stage;
    body.dataset.state = mode === "done" || mode === "cancelled" || mode === "error" ? mode : (state.running ? "running" : "idle");

    el("state-text").textContent = {
      running: "Working",
      done: "Done",
      error: "Stopped",
      cancelled: "Cancelled",
    }[body.dataset.state] || "Ready";

    el("message").textContent = state.error || state.message || "Paste a link to get started.";

    const percent = state.percent;
    const known = percent !== null && percent !== undefined;
    el("bar").dataset.indeterminate = state.running && !known ? "true" : "false";
    if (known) el("bar").style.width = percent + "%";
    else if (!state.running) el("bar").style.width = "0";

    if (state.running) {
      setFigure(known ? Math.round(percent) + "%" : "···", state.stage.replace(/-/g, " "), false);
    } else if (body.dataset.state === "done") {
      const tempo = tempoOf(state.outputs || []);
      if (tempo) setFigure(tempo, "BPM — click to copy", true);
      else setFigure("✓", "Finished", false);
    } else if (body.dataset.state === "error" || body.dataset.state === "cancelled") {
      setFigure("···", body.dataset.state === "cancelled" ? "Cancelled" : "Stopped", false);
    } else {
      setFigure("···", "", false);
    }

    el("go").textContent = state.running ? "Stop" : "Steal it";
    el("go").dataset.mode = state.running ? "cancel" : "go";
    if (state.output_dir) setDestination(state.output_dir);
  }

  // Songs are listed rather than loose files so "go back for another stem"
  // has something to hang off: the link belongs to the song, not to any one
  // wav it produced.
  function renderLibrary(songs) {
    const list = el("outputs");
    el("empty").hidden = songs.length > 0;
    list.replaceChildren(...songs.map(renderSong));
  }

  function renderSong(song) {
    const item = document.createElement("li");
    item.className = "song";

    const open = document.createElement("button");
    open.className = "song-open";
    open.title = "Show this song's folder in Finder";

    const title = document.createElement("span");
    title.className = "song-title";
    title.textContent = song.title;
    open.append(title);

    const tempo = tempoOf(song.files || []);
    if (tempo) {
      const meta = document.createElement("span");
      meta.className = "song-meta";
      meta.textContent = tempo + " BPM";
      open.append(meta);
    }

    open.addEventListener("click", () => window.pywebview.api.reveal(song.dir || song.song));
    item.append(open);

    // The same six squares as the Take section, in the same order.
    const marks = document.createElement("div");
    marks.className = "marks";
    for (const thing of STASH_ORDER) {
      const path = (song.have || {})[thing];
      const mark = document.createElement("button");
      mark.className = "mark";
      mark.dataset.have = path ? "true" : "false";
      mark.title = path ? LABELS[thing] + " — click to show it in Finder" : "No " + LABELS[thing].toLowerCase() + " yet";
      if (path) mark.addEventListener("click", () => window.pywebview.api.reveal(path));
      marks.append(mark);
    }
    item.append(marks);

    const take = document.createElement("button");
    take.className = "again";
    take.textContent = "Take more";
    take.title = "Point the Take section at this song";
    take.addEventListener("click", () => selectSong(song));
    item.append(take);

    return item;
  }

  // --- what's armed, and what's already in the stash ---------------------

  const STASH_ORDER = ["song", "drums", "beat", "midi", "bass", "harmony", "vocals"];
  const LABELS = {
    song: "Song", drums: "Drums", beat: "Beat", midi: "Midi",
    bass: "Bass", harmony: "Harmony", vocals: "Vocals",
  };

  // What each thing needs before it can exist. A beat (the trimmed .wav)
  // and its midi are both cut out of the drum stem, independently of one
  // another - a steal writes whichever one you clicked, never both - and
  // every stem is separated out of the song, so arming one arms what it's
  // made from.
  const NEEDS = {
    song: [],
    drums: ["song"], bass: ["song"], harmony: ["song"], vocals: ["song"],
    beat: ["song", "drums"], midi: ["song", "drums"],
  };

  let selected = null;   // the song the Take section is pointed at, if any

  // The two things worth having more than one of. Every stem is a file the
  // song either has or hasn't, and taking it again would only write the same
  // file twice - but a beat (or its midi) is a phrase somebody picked by
  // ear, and the verse and the chorus of the same drums are two different
  // loops. So a green Beat or Midi can still be armed, and goes purple like
  // anything else.
  const MORE_THAN_ONE = new Set(["beat", "midi"]);

  function padFor(thing) { return el("pad-" + thing); }
  function isArmed(thing) { return padFor(thing).getAttribute("aria-pressed") === "true"; }
  function have(thing) { return padFor(thing).dataset.have === "true"; }
  function canArm(thing) { return !have(thing) || MORE_THAN_ONE.has(thing); }

  // Held on because something else that's armed is made out of it. Turning
  // this off would leave a run that can't finish, so it isn't offered: the
  // way to release it is to turn off the thing that needs it. A prerequisite
  // already in the stash is never armed in the first place, so it's never
  // locked either - green needs nothing.
  function lockedOn(thing) {
    return STASH_ORDER.some(
      (other) => other !== thing && isArmed(other) && NEEDS[other].includes(thing));
  }

  function setArmed(thing, on) {
    padFor(thing).setAttribute("aria-pressed", on && canArm(thing) ? "true" : "false");
  }

  function showLocks() {
    for (const thing of STASH_ORDER) {
      const locked = isArmed(thing) && lockedOn(thing);
      padFor(thing).dataset.locked = locked ? "true" : "false";
      padFor(thing).title = locked
        ? "Needed for what else is armed — turn that off first"
        : "";
    }
  }

  function togglePad(thing) {
    if (!canArm(thing)) return;            // green isn't a state you click out of
    if (isArmed(thing)) {
      if (lockedOn(thing)) return;         // and neither is something held on
      setArmed(thing, false);
    } else {
      setArmed(thing, true);
      for (const needed of NEEDS[thing]) setArmed(needed, true);
    }
    showLocks();
    describeTake();
    // Beat/Midi can be flipped while the picker is open - the section is
    // marked once, but what to keep from it is a choice you might change
    // your mind on right up until you click Build.
    refreshBuildEnabled();
  }

  function selectSong(song) {
    // "Take more" always leaves the picker workflow behind, whether it was
    // idle-marked or mid-build - it's pointed at whatever song was selected
    // before, and that's no longer the one being taken from.
    if (!el("picker").hidden) closePicker();
    selected = song;
    el("url").value = song.title;
    for (const thing of STASH_ORDER) {
      padFor(thing).dataset.have = (song.have || {})[thing] ? "true" : "false";
      setArmed(thing, false);
    }
    showLocks();
    describeTake();
  }

  function clearSelection() {
    selected = null;
    for (const thing of STASH_ORDER) {
      padFor(thing).dataset.have = "false";
      setArmed(thing, thing === "song");
    }
    showLocks();
    describeTake();
  }

  function describeTake() {
    const armed = STASH_ORDER.filter(isArmed);
    el("take-note").textContent = selected
      ? (armed.length ? "Taking " + armed.map((t) => (have(t) ? "another " : "") + LABELS[t].toLowerCase()).join(", ") + " from " + selected.title
                      : "Nothing armed — click a square to take something from " + selected.title + ".")
      : "All four stems rebuild the song.";
  }

  let lastLibrary = null;

  function refreshLibrary() {
    return window.pywebview.api.library().then((songs) => {
      lastLibrary = songs;
      renderLibrary(songs);
      // Keep the pads honest about a song that just gained something.
      if (selected) {
        const fresh = songs.find((s) => s.song === selected.song);
        if (fresh) {
          selected = fresh;
          for (const thing of STASH_ORDER) {
            padFor(thing).dataset.have = (fresh.have || {})[thing] ? "true" : "false";
            // Something that just arrived isn't waiting to be taken any
            // more - except a beat, where staying armed is how you go
            // straight on and steal the next one.
            if (!canArm(thing)) setArmed(thing, false);
          }
          showLocks();
          describeTake();
        }
      }
      return songs;
    });
  }

  // The path reads right-to-left (see the CSS) so that a long path gets
  // clipped at its front rather than losing the folder name at the end.
  // That flips a leading "/" to the wrong side, so the bidi marker pins it.
  function setDestination(dir) {
    el("destination").querySelector(".where").textContent = "\u202A" + dir;
    el("destination").dataset.dir = dir;
  }

  // --- the picker --------------------------------------------------------
  //
  // A beat is found by ear. The waveform gets you near the phrase; you
  // start it playing and hit space where it ends. Nothing here decides
  // anything musical - it only collects two times and hands them over.

  const wave = el("wave");
  const detail = el("detail");
  let picker = null;     // { song, peaks, duration, kicks, grid, buffer, start, end }
  let raf = null;

  // Playback is Web Audio, not an <audio> element, and that is the whole
  // reason the marks can be trusted.
  //
  // An <audio> playing an mp3 seeks to a frame boundary - 1152 samples, 52ms
  // at the rate this preview is encoded at - and carries the encoder's own
  // delay on top. So the position the page thought it was at and the
  // position of the stem it was actually playing were tens of milliseconds
  // apart, and every marking inherited that. It also had to pause, seek, and
  // wait for the "seeked" event before resuming, which is where the delay
  // between clicking and hearing anything came from.
  //
  // A decoded buffer has neither problem: start(when, offset) takes an exact
  // offset in seconds and begins immediately, and the position is read off
  // the audio clock rather than asked of an element.
  let audioCtx = null;
  let source = null;      // the live AudioBufferSourceNode, if any
  let startedAt = 0;      // ctx.currentTime when this stretch of playback began
  let startedFrom = 0;    // where in the stem it began
  let playing = false;

  function context() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  // Where in the stem we are, to the sample. Paused, it is wherever we
  // stopped; playing, it is the audio clock's own answer rather than a
  // number counted up per frame.
  function playhead() {
    if (!picker) return 0;
    if (!playing) return picker.at;
    return Math.min(picker.duration, startedFrom + (context().currentTime - startedAt));
  }

  function clock(seconds) {
    if (!isFinite(seconds)) return "0:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ":" + String(s).padStart(2, "0");
  }

  // --- the grid ------------------------------------------------------------
  //
  // Python fits it (pulse.py) in local windows and hands over a run of them,
  // because no single grid holds across a whole song - a whole-song tempo
  // estimate a few tenths of a percent out drifts several sixteenths by the
  // end. All this does is pick the one covering a moment.

  function gridAt(when) {
    if (!picker || !picker.grid.length) return null;
    for (const grid of picker.grid) {
      if (grid.start <= when && when < grid.end) return grid;
    }
    return when < picker.grid[0].start ? picker.grid[0] : picker.grid[picker.grid.length - 1];
  }

  // A sixteenth and a beat, measured off the drumming where that is known
  // and off the filename's tempo where it isn't. This is what the arrow keys
  // move by, so it being right is the difference between nudging onto the
  // beat and nudging near it.
  function stepAt(when) {
    const grid = gridAt(when);
    return grid ? grid.step : picker.nudge;
  }

  function beatAt(when) {
    const grid = gridAt(when);
    return grid ? grid.step * 4 : picker.beat;
  }

  // How far a click is allowed to be dragged onto a real kick. Half a
  // sixteenth, so a click can never be pulled past the step it was aimed at,
  // and never more than a shade over a tenth of a second whatever the tempo.
  const SNAP_LIMIT_SEC = 0.12;

  function snapToKick(when) {
    if (!picker || !picker.kicks.length) return when;
    const limit = Math.min(SNAP_LIMIT_SEC, stepAt(when) / 2);
    let best = when, bestGap = limit;
    for (const at of picker.kicks) {
      if (at < when - limit) continue;
      if (at > when + limit) break;
      const gap = Math.abs(at - when);
      if (gap < bestGap) { bestGap = gap; best = at; }
    }
    return best;
  }

  // --- drawing -------------------------------------------------------------

  function drawWave() {
    const ctx = wave.getContext("2d");
    const w = wave.width, h = wave.height;
    ctx.clearRect(0, 0, w, h);
    if (!picker) return;

    const peaks = picker.peaks;
    const mid = h / 2;
    const barW = w / peaks.length;
    const at = playhead();

    // The marked region, painted behind the waveform so it reads as
    // highlight rather than as another wave.
    if (picker.start !== null) {
      const from = (picker.start / picker.duration) * w;
      const to = ((picker.end === null ? at : picker.end) / picker.duration) * w;
      ctx.fillStyle = "rgba(167, 139, 250, 0.16)";
      ctx.fillRect(Math.min(from, to), 0, Math.abs(to - from), h);
    }

    ctx.fillStyle = "#3d414b";
    for (let i = 0; i < peaks.length; i++) {
      const bar = Math.max(1, peaks[i] * (h * 0.86));
      ctx.fillRect(i * barW, mid - bar / 2, Math.max(1, barW - 0.5), bar);
    }

    for (const [time, colour] of [[picker.start, "#a78bfa"], [picker.end, "#5fd39a"]]) {
      if (time === null) continue;
      const x = (time / picker.duration) * w;
      ctx.fillStyle = colour;
      ctx.fillRect(x - 1, 0, 2, h);
    }

    if (playing) {
      const x = (at / picker.duration) * w;
      ctx.fillStyle = "#e9e7e2";
      ctx.fillRect(x - 0.5, 0, 1, h);
    }

    const flash = barFlash();
    if (flash > 0) {
      ctx.fillStyle = "rgba(233, 231, 226, " + (FLASH_STRENGTH * flash).toFixed(3) + ")";
      ctx.fillRect(0, 0, w, h);
    }
  }

  // How much of the song the zoomed strip shows. Four bars: enough that the
  // pattern is recognisable, few enough that a sixteenth is still a visible
  // distance rather than a hairline.
  const DETAIL_BARS = 4;

  function detailSpan() {
    const grid = gridAt(detailCentre());
    return (grid ? grid.step * 16 : picker.beat * 4) * DETAIL_BARS;
  }

  // Centred on the playhead while it moves, and on the start once it has
  // stopped - the two moments you are asking "is this the one?".
  function detailCentre() {
    if (!picker) return 0;
    if (playing) return playhead();
    return picker.start === null ? playhead() : picker.start;
  }

  function drawDetail() {
    const ctx = detail.getContext("2d");
    const w = detail.width, h = detail.height;
    ctx.clearRect(0, 0, w, h);
    if (!picker) return;

    const span = detailSpan();
    const from = detailCentre() - span / 2;
    const x = (when) => ((when - from) / span) * w;

    // The waveform for this window, drawn off the decoded audio rather than
    // the 900-bucket envelope - at this zoom a bucket is several bars wide
    // and would draw as one flat block.
    if (picker.buffer) {
      const data = picker.buffer.getChannelData(0);
      const rate = picker.buffer.sampleRate;
      const mid = h / 2;
      ctx.fillStyle = "#33373f";
      const perPixel = (span * rate) / w;
      const stride = Math.max(1, Math.floor(perPixel / 24));
      for (let px = 0; px < w; px++) {
        const first = Math.floor((from + picker.lead + (px / w) * span) * rate);
        let loudest = 0;
        for (let i = 0; i < perPixel; i += stride) {
          const sample = data[first + i];
          if (sample === undefined) break;
          const level = sample < 0 ? -sample : sample;
          if (level > loudest) loudest = level;
        }
        const bar = Math.max(1, loudest * h * 0.9);
        ctx.fillRect(px, mid - bar / 2, 1, bar);
      }
    }

    // The grid. Bars heaviest, beats next, sixteenths faint - so which line
    // is which is readable at a glance instead of counting.
    const grid = gridAt(detailCentre());
    if (grid) {
      const first = Math.floor((from - grid.downbeat) / grid.step) - 1;
      const last = Math.ceil((from + span - grid.downbeat) / grid.step) + 1;
      for (let n = first; n <= last; n++) {
        const at = grid.downbeat + n * grid.step;
        const bar = ((n % 16) + 16) % 16 === 0;
        const beat = ((n % 4) + 4) % 4 === 0;
        ctx.fillStyle = bar ? "rgba(233, 231, 226, 0.42)"
                            : beat ? "rgba(233, 231, 226, 0.20)"
                                   : "rgba(233, 231, 226, 0.07)";
        ctx.fillRect(x(at), bar ? 0 : h * 0.12, 1, bar ? h : h * 0.76);
      }
    }

    // The kicks a click snaps onto, so what will happen is visible before it
    // happens.
    ctx.fillStyle = "#5fd39a";
    for (const at of picker.kicks) {
      if (at < from) continue;
      if (at > from + span) break;
      ctx.fillRect(x(at) - 1, h - 5, 2, 5);
    }

    for (const [time, colour] of [[picker.start, "#a78bfa"], [picker.end, "#5fd39a"]]) {
      if (time === null || time < from || time > from + span) continue;
      ctx.fillStyle = colour;
      ctx.fillRect(x(time) - 1, 0, 2, h);
    }

    if (playing) {
      ctx.fillStyle = "#e9e7e2";
      ctx.fillRect(x(playhead()) - 0.5, 0, 1, h);
    }
  }

  // Every bar, the whole waveform lights up on the one.
  //
  // This is the only way to check the thing the loop depends on and that
  // nothing else shows you: whether the bars you are hearing land where the
  // drummer's do. Blinking them past you turns that from a calculation into
  // something you either see agreeing with what you hear or you don't.
  //
  // Anchored to the grid the drumming itself agrees on, not to wherever you
  // last clicked. It used to be the latter, which meant it said nothing at
  // all until you had clicked - and then flashed a bar grid built out of
  // your click rather than out of the song, which is confidently wrong
  // rather than merely absent.
  //
  // The light fades over its own length rather than blinking on and off,
  // because a flash that vanishes in one frame reads as a dropped frame.
  const BEATS_PER_BAR = 4;
  const FLASH_SEC = 0.12;
  const FLASH_STRENGTH = 0.14;

  function barFlash() {
    if (!picker || !playing) return 0;
    const grid = gridAt(playhead());
    if (!grid || !(grid.step > 0)) return 0;
    const bar = grid.step * 4 * BEATS_PER_BAR;
    const since = playhead() - grid.downbeat;
    const into = ((since % bar) + bar) % bar;
    return into < FLASH_SEC ? 1 - into / FLASH_SEC : 0;
  }

  function markedSoFar() {
    if (!picker || picker.start === null) return null;
    const to = picker.end === null ? playhead() : picker.end;
    return Math.max(0, to - picker.start);
  }

  // Deliberately no bar count here. Bars aren't known until the section
  // exists - the section is what decides how long a bar is - so the only
  // honest thing to show while you're still listening is how long you've
  // held it for.
  function showClock() {
    if (!picker) return;
    const marked = markedSoFar();
    el("marked").textContent = marked === null ? "" : "marked " + marked.toFixed(1) + "s";
    el("clock").textContent = clock(playhead()) + " / " + clock(picker.duration);
  }

  function tick() {
    if (!picker) return;
    showClock();
    drawWave();
    drawDetail();
    raf = requestAnimationFrame(tick);
  }

  function stopSource() {
    if (!source) return;
    source.onended = null;
    try { source.stop(); } catch (e) { /* already stopped */ }
    source.disconnect();
    source = null;
  }

  function playFrom(seconds) {
    if (!picker || !picker.buffer) return;
    const ctx = context();
    // A page that has never made a sound starts its context suspended. The
    // click that got us here is the gesture that lifts that.
    if (ctx.state === "suspended") ctx.resume();

    stopSource();
    picker.at = Math.max(0, Math.min(seconds, picker.duration));

    source = ctx.createBufferSource();
    source.buffer = picker.buffer;
    source.connect(ctx.destination);
    source.onended = () => { if (source) pausePlay(); };
    // picker.lead is how far into the decoded copy the stem's zero actually
    // sits - see decoderLead. Everything outside this line is in stem time.
    source.start(0, Math.min(picker.at + picker.lead, picker.buffer.duration));

    startedAt = ctx.currentTime;
    startedFrom = picker.at;
    playing = true;
    el("play").textContent = "Pause";
    if (!raf) tick();
  }

  function pausePlay() {
    if (picker) picker.at = playhead();
    stopSource();
    playing = false;
    el("play").textContent = "Play";
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    showClock();
    drawWave();
    drawDetail();
  }

  // --- lining the listening copy up with the stem --------------------------

  // The page plays a small mp3 and the build cuts the real wav, so any
  // offset between those two lands directly on every marking made by ear.
  //
  // Python measures that offset when it makes the preview and sends it as
  // prepared.lead (see audition._preview_lead) - which settles the encoder's
  // side of it exactly. What Python cannot know is what *this* decoder does
  // with the gapless information in the file. So that half is checked here,
  // from evidence rather than from assumption: if WebKit stripped the
  // encoder's delay, the decoded copy is the same length as the stem, and
  // if it did not, the copy is longer by that delay plus its padding.
  //
  // Only the second case needs a correction, and only then is the constant
  // used at all.
  const LAME_DELAY_SAMPLES = 1105;   // 576 of lookahead, 529 of decoder delay
  const LENGTH_SLACK_SEC = 0.01;

  function decoderLead(buffer, sourceDuration) {
    if (!(sourceDuration > 0)) return 0;
    const extra = buffer.duration - sourceDuration;
    if (extra < LENGTH_SLACK_SEC) return 0;   // stripped it: nothing to undo
    return LAME_DELAY_SAMPLES / buffer.sampleRate;
  }

  function decodeDataUri(uri) {
    const binary = atob(uri.slice(uri.indexOf(",") + 1));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  // --- opening and closing -------------------------------------------------

  function openPicker(song) {
    closePicker();
    el("picker").hidden = false;
    // Marking a section takes the readout's place. What's in it - the tempo,
    // the progress bar, Steal it - all belongs to the run that just ended.
    el("readout").hidden = true;
    el("go").hidden = true;
    // The link box has focus at this point - it's autofocused on load, and
    // it's where a link was just typed or a song's name was just put. Space
    // typed into a text box is a space, so the keydown handler below has to
    // ignore it there, which left the whole interaction dead: the picker
    // open, the hint saying "hit space", and space doing nothing. Letting it
    // go is the fix; from here the page's only job is listening.
    el("url").blur();
    el("picker-title").textContent = song.title;
    el("picker-hint").textContent = "Getting the audio...";

    window.pywebview.api.audition(song.have.drums).then((prepared) => {
      if (prepared.error) { el("picker-hint").textContent = prepared.error; return; }
      picker = {
        song, peaks: prepared.peaks, duration: prepared.duration,
        kicks: prepared.kicks || [],
        grid: prepared.grid || [],
        buffer: null,
        lead: 0,
        at: 0,
        start: null, end: null,
        // Fallbacks only. Where the grid reaches, stepAt/beatAt use what the
        // drumming actually says instead - a filename tempo is a whole-song
        // estimate and is routinely a fraction of a percent out.
        beat: prepared.tempo > 0 ? 60 / prepared.tempo : FALLBACK_BEAT_SEC,
        nudge: prepared.tempo > 0 ? 60 / prepared.tempo / 4 : FALLBACK_NUDGE_SEC,
      };
      el("play").disabled = true;
      drawWave();
      drawDetail();

      const opened = picker;
      context().decodeAudioData(decodeDataUri(prepared.audio)).then((buffer) => {
        if (picker !== opened) return;   // closed, or moved on, while decoding
        picker.buffer = buffer;
        picker.lead = (prepared.lead || 0) + decoderLead(buffer, prepared.duration);
        el("play").disabled = false;
        el("picker-hint").textContent =
          "Click at the 1 of the phrase — ← → a sixteenth, ⇧ a beat — space at the next 1.";
        drawDetail();
      }).catch((e) => {
        el("picker-hint").textContent = "Could not read the audio: " + e;
      });
    });
  }

  function closePicker() {
    stopSource();
    playing = false;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    // A build still in flight is left to finish on the Python side - its
    // file still gets written - but nothing here should keep polling into a
    // picker that's no longer on screen.
    if (beatPolling) { clearInterval(beatPolling); beatPolling = null; }
    picker = null;
    el("picker").hidden = true;
    el("readout").hidden = false;
    el("go").hidden = false;
    el("play").textContent = "Play";
    el("build").disabled = true;
    el("marked").textContent = "";
  }

  // Clicking is one intent - "start it here" - so it's one action. It used
  // to set the point silently and leave you to go and find the Play button,
  // which is two actions for one thought and made every correction cost a
  // trip to the mouse. Clicking again mid-play is how you make a big move.
  //
  // The click is pulled onto the nearest kick, within half a sixteenth. A
  // section is nearly always wanted starting on one, a mouse cannot land on
  // one to the millisecond, and the build used to fix that up afterwards by
  // moving the cut - which meant the file you got was not the audio you
  // auditioned. Doing it here instead makes those the same thing.
  function seekFromClick(event, canvas) {
    if (!picker || el("play").disabled) return;
    const box = canvas.getBoundingClientRect();
    const fraction = (event.clientX - box.left) / box.width;
    const at = canvas === detail
      ? detailCentre() - detailSpan() / 2 + fraction * detailSpan()
      : fraction * picker.duration;
    setStart(snapToKick(at));
  }

  // keepEnd is what separates the two ways of moving the start. A click is
  // "start over here", so it throws the end away. An arrow is a correction
  // to a section you've already marked out, so the end stays put - otherwise
  // nudging onto the one would cost you the end you just caught.
  function setStart(seconds, keepEnd) {
    picker.start = Math.max(0, Math.min(seconds, picker.duration));
    if (!keepEnd || picker.end <= picker.start) {
      picker.end = null;
      refreshBuildEnabled();
    }
    playFrom(picker.start);
    drawWave();
    drawDetail();
  }

  // Nudging re-seeks and keeps playing, so every press re-auditions the one
  // from its new spot. That's the whole point: you find the downbeat by
  // hearing it land, not by looking at anything.
  //
  // The steps are musical - a sixteenth, and a beat with shift - rather than
  // round numbers of seconds. A round 0.2s couldn't express a sixteenth (at
  // 105 BPM that's 0.142s), and a section landing a sixteenth off the beat
  // is the commonest way a loop comes out right in every respect except
  // where it starts. There was no key combination that fixed it.
  const FALLBACK_NUDGE_SEC = 0.2;   // a stem with no tempo in its name
  const FALLBACK_BEAT_SEC = 1.0;

  function nudgeStart(steps) {
    if (!picker || picker.start === null) return;
    setStart(picker.start + steps * stepAt(picker.start), true);
    sayWhatIsMarked();
  }

  // Sliding takes the end with it, so the section keeps its length and only
  // moves. That's the shape of the mistake this is for: a loop that's right
  // in every respect but starts - and therefore ends - a beat or two out.
  // Rotating it by whole beats is the exact fix, and it's a fix you can hear
  // rather than one guessed at from the drumming.
  function slideSection(beats) {
    if (!picker || picker.start === null) return;
    const by = beats * beatAt(picker.start);
    const span = picker.end === null ? 0 : picker.end - picker.start;
    const start = Math.max(0, Math.min(picker.start + by, picker.duration - span));

    picker.start = start;
    if (picker.end !== null) picker.end = start + span;
    playFrom(picker.start);
    drawWave();
    drawDetail();
    sayWhatIsMarked();
  }

  function sayWhatIsMarked() {
    if (picker.end === null) return;
    el("picker-hint").textContent = (picker.end - picker.start).toFixed(1) +
      "s marked — build the beat, ⇧← ⇧→ to slide it a beat, or space to play it again and space at the next 1.";
  }

  // Space only says where the phrase ends. Building the .mid is a separate
  // press, because the two are separate decisions - marking is something you
  // do by reflex, on the beat, and it shouldn't be able to commit you to an
  // export you haven't looked at yet.
  function markEnd() {
    if (!picker || picker.start === null) return;
    const end = playhead();
    if (end <= picker.start) { el("picker-hint").textContent = "That is before the start - click again and play on."; return; }
    picker.end = end;
    pausePlay();
    refreshBuildEnabled();
    sayWhatIsMarked();
    drawWave();
    drawDetail();
  }

  // Building a beat has no percentage of its own - one model pass with
  // nothing to count chunks of, unlike demucs - so what there is to show is
  // which phase it's in (see beat_loop.build's on_phase), polled the same
  // way a run's status() is.
  let beatPolling = null;

  // What to keep from the build is the Take section's Beat/Midi pads, not a
  // choice made in the picker - and since the pads stay live while a section
  // is marked, that choice can change right up until Build is clicked (see
  // gui.Api.steal_beat's outputs param).
  function outputsFromPads() {
    const wav = isArmed("beat"), midi = isArmed("midi");
    if (wav && midi) return "both";
    if (wav) return "wav";
    if (midi) return "midi";
    return null;
  }

  function refreshBuildEnabled() {
    if (!picker) return;
    el("build").disabled = !(picker.start !== null && picker.end !== null && outputsFromPads());
  }

  // Where the marking was when Build was clicked, kept because the picker
  // closes itself on success and the result is reported after that.
  let builtFrom = null;

  function buildBeat() {
    const outputs = outputsFromPads();
    if (!picker || picker.start === null || picker.end === null || !outputs) return;
    const end = picker.end;
    builtFrom = picker.start;
    pausePlay();
    el("build").disabled = true;
    // Set before the call even returns, not after - a fast build can finish
    // before the first 250ms poll fires, and without this the picker would
    // jump straight from the click to the result with nothing shown between.
    el("picker-hint").textContent = "Cutting the section...";

    window.pywebview.api.steal_beat_start(picker.song.have.drums, picker.start, end, outputs).then((snapshot) => {
      if (snapshot.busy) {
        // A build was already running when this click landed - it's still
        // that one's result on the way, not this click's, so say so rather
        // than letting the click look like it did nothing.
        el("picker-hint").textContent = "Still working on the last one...";
      }
      if (beatPolling) clearInterval(beatPolling);
      beatPolling = setInterval(pollBeat, 250);
      pollBeat();
    });
  }

  function pollBeat() {
    window.pywebview.api.beat_status().then((state) => {
      if (state.running) {
        el("picker-hint").textContent = state.phase || "Building it...";
        return;
      }
      clearInterval(beatPolling);
      beatPolling = null;

      if (state.error) {
        refreshBuildEnabled();
        el("picker-hint").textContent = state.error;
        return;
      }
      const loop = state.result;
      const summary =
        loop.bars + " bar" + (loop.bars === 1 ? "" : "s") + ", " + loop.hits + " hits" +
        // Notes worked out from the pattern rather than heard - say so.
        (loop.inferred ? " (" + loop.inferred + " put back)" : "") + ", " +
        loop.pieces.join(" / ") + " — set Ableton to " + loop.tempo + " BPM" +
        tempoQuibble(loop) + cutMoved(loop);
      refreshLibrary().then(() => {
        closePicker();
        el("message").textContent = summary;
      });
    });
  }

  // The build is still allowed to move the cut onto a kick when the marking
  // landed on nothing (beat_loop._kick_downbeat), and a move nobody is told
  // about is how a loop ends up starting somewhere you never heard it start.
  // Normally this says nothing at all, because clicking snaps onto a kick and
  // a marked kick is never moved off - so if it does speak up, it is telling
  // you the marking missed.
  const CUT_MOVED_SEC = 0.03;

  function cutMoved(loop) {
    if (builtFrom === null || loop.origin === undefined) return "";
    const moved = loop.origin - builtFrom;
    if (Math.abs(moved) < CUT_MOVED_SEC) return "";
    return " (cut moved " + moved.toFixed(2) + "s onto a kick)";
  }

  // The loop is measured off the section you marked, so if you held it a bar
  // too long its tempo comes out wrong by that much. Nothing can tell from
  // here whether that was a slip or a phrase that genuinely runs at its own
  // speed, so it says what it found and leaves the judgement with you.
  const TEMPO_QUIBBLE = 0.05;

  function tempoQuibble(loop) {
    if (!loop.song_tempo) return "";
    const off = Math.abs(loop.tempo - loop.song_tempo) / loop.song_tempo;
    if (off < TEMPO_QUIBBLE) return "";
    // A section held too long stretches its own bars, so it reads as slower.
    const longOrShort = loop.tempo < loop.song_tempo ? "long" : "short";
    return " (the song runs at " + loop.song_tempo +
           " — you may have marked the phrase " + longOrShort + ")";
  }

  // The picker is the one part of this page that can only be checked by
  // driving a real window - the pywebview bridge and a playing <audio>
  // don't exist anywhere else - and all of its state is in closures above.
  // This is the single read-only window onto it, so a driver can dispatch
  // real clicks and keystrokes and then ask what happened, rather than
  // calling the handlers directly and proving nothing (which is exactly how
  // a dead spacebar survived a round of "verified").
  window.__picker = () => picker && {
    start: picker.start,
    end: picker.end,
    duration: picker.duration,
    beat: beatAt(picker.start === null ? playhead() : picker.start),
    nudge: stepAt(picker.start === null ? playhead() : picker.start),
    playing: playing,
    at: playhead(),
    // Measured, not assumed: how far into the decoded listening copy the
    // stem's zero sits. A driver checking that what you hear is what gets
    // cut needs to be able to see it.
    lead: picker.lead,
    kicks: picker.kicks.length,
    grid: picker.grid.length,
    decoded: picker.buffer !== null,
  };

  // --- talking to Python -------------------------------------------------

  // Which stage the library was last refreshed for, so a downloaded song
  // (or a stem that just finished isolating) shows up green as soon as it
  // exists rather than waiting for every armed instrument to be done -
  // library() is cheap, but polling it every 250ms regardless would be
  // wasteful, so this only calls it again when the stage actually moves on.
  let lastStage = null;

  function poll() {
    window.pywebview.api.status().then((state) => {
      render(state);
      if (state.stage !== lastStage) {
        lastStage = state.stage;
        refreshLibrary();
      }
      if (!state.running && polling) {
        clearInterval(polling);
        polling = null;
        refreshLibrary().then(() => {
          // The drums are there now, so the phrase can be picked.
          const waiting = pendingBeatFor;
          pendingBeatFor = null;
          if (waiting && !state.error && !state.cancelled) {
            const fresh = songWaitedFor(waiting, state);
            if (fresh && fresh.have && fresh.have.drums) openPicker(fresh);
            else el("message").textContent =
              "There's no drum stem to pick a beat out of — arm Drums and take it again.";
          }
        });
      }
    });
  }

  function start() {
    const options = {};
    for (const thing of STASH_ORDER) options[thing] = isArmed(thing);

    // Neither Beat nor Midi is something a run can produce - both need you
    // to hear the phrase - so they're dropped from what's asked for and
    // remembered as what to do once the drums exist. Which of the two was
    // armed doesn't matter from here: either way the picker opens, and it
    // offers both buttons itself once you've marked a section.
    const wantsBeat = options.beat || options.midi;
    delete options.beat;
    delete options.midi;

    if (selected) {
      // "source", not "song": every other key here is an armed/not flag,
      // and one of the squares is called Song.
      options.source = selected.song;
      // Nothing left to separate: go straight to the picker.
      if (wantsBeat && !options.drums && selected.have && selected.have.drums) {
        openPicker(selected);
        return;
      }
    }
    // Remembered as a path rather than as the song object, because a link
    // that hasn't been downloaded yet has no song object to remember - and
    // that's the ordinary case: paste a link, click Beat, take it.
    pendingBeatFor = wantsBeat ? { song: selected ? selected.song : "" } : null;

    lastStage = null;
    window.pywebview.api.start(el("url").value, options).then((state) => {
      render(state);
      if (state.running && !polling) polling = setInterval(poll, 250);
    }).catch(complain);
  }

  // A call into Python that raises rejects the promise, and a rejection
  // nobody catches is silent - the button looks broken and the page says
  // "Ready". Anything that goes wrong across the bridge gets said out loud.
  function complain(problem) {
    body.dataset.state = "error";
    el("state-text").textContent = "Stopped";
    el("message").textContent = String(problem && problem.message || problem);
    setFigure("···", "Stopped", false);
  }

  window.addEventListener("unhandledrejection", (event) => complain(event.reason));

  // A song whose beat was armed, waiting for its drums to finish.
  let pendingBeatFor = null;

  // Which song that run was about. A song picked out of the stash is known
  // by its path from the start; a freshly downloaded one isn't known until
  // it exists, so it's recognised by the run's own outputs - and failing
  // that, by being the newest thing in the stash, which it is.
  function songWaitedFor(waiting, state) {
    const songs = lastLibrary || [];
    if (waiting.song) return songs.find((s) => s.song === waiting.song);
    const outputs = state.outputs || [];
    return songs.find((s) => outputs.includes(s.song)) || songs[0];
  }

  // --- wiring ------------------------------------------------------------

  document.querySelectorAll(".pad").forEach((pad) => {
    pad.addEventListener("click", () => togglePad(pad.dataset.stem));
  });

  // Typing a link is starting over on a new song, so the stash colours from
  // whatever was selected before don't apply any more.
  el("url").addEventListener("input", () => { if (selected) clearSelection(); });

  el("go").addEventListener("click", () => {
    if (running) window.pywebview.api.cancel().then(render);
    else start();
  });

  el("url").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !running) start();
  });

  el("figure").addEventListener("click", () => {
    if (el("figure").dataset.copyable !== "true") return;
    const tempo = el("figure").textContent;
    // A file:// page can't rely on the async clipboard API, so go through a
    // throwaway textarea - the copy is the whole point of showing the number.
    const scratch = document.createElement("textarea");
    scratch.value = tempo;
    document.body.append(scratch);
    scratch.select();
    document.execCommand("copy");
    scratch.remove();
    el("unit").textContent = "BPM — copied";
  });

  el("destination").addEventListener("click", () => {
    window.pywebview.api.open_output_dir(el("destination").dataset.dir || "");
  });

  wave.addEventListener("click", (event) => seekFromClick(event, wave));
  detail.addEventListener("click", (event) => seekFromClick(event, detail));
  el("picker-close").addEventListener("click", closePicker);

  // Play is for hearing the section you've marked, not for resuming where
  // you happened to stop - so it always goes back to the start you set, or
  // to the top of the stem if you haven't set one yet.
  el("play").addEventListener("click", () => {
    if (!picker) return;
    if (!playing) playFrom(picker.start === null ? 0 : picker.start);
    else pausePlay();
  });

  el("build").addEventListener("click", buildBeat);

  // The keyboard is the picker. Space marks the end and the arrows walk the
  // start onto the one - but only while the picker is open, and never while
  // a link is being typed into the box.
  document.addEventListener("keydown", (event) => {
    if (el("picker").hidden) return;
    const keyed = event.code === "Space" || event.code === "ArrowLeft" || event.code === "ArrowRight";
    if (!keyed) return;
    // Somewhere you can type is the one place these are just keys. The link
    // box is autofocused, so without this the whole interaction is dead -
    // which is exactly how the spacebar came to do nothing for a while.
    const typing = document.activeElement;
    if (typing && (typing.tagName === "INPUT" || typing.tagName === "TEXTAREA")) return;
    // Stops space pressing whatever button was last clicked, and stops the
    // arrows scrolling the window out from under the waveform.
    event.preventDefault();

    // Space does whichever of the two things the moment calls for. Stopped,
    // it starts the stem playing - the same thing the Play button does, and
    // the thing your hand is already on the key for. Playing, it marks the
    // end. There's no ambiguity to resolve: you can't mark the end of a
    // phrase that isn't running past you, and pressing Play was a trip to
    // the mouse in the middle of an interaction that is otherwise entirely
    // by ear.
    if (event.code === "Space") {
      if (el("play").disabled) return;
      if (!playing) playFrom(picker.start === null ? 0 : picker.start);
      else markEnd();
      return;
    }
    const direction = event.code === "ArrowLeft" ? -1 : 1;
    if (event.shiftKey) slideSection(direction);
    else nudgeStart(direction);
  });

  window.addEventListener("pywebviewready", () => {
    poll();
    // Song armed, nothing green, nothing selected - the state a pasted
    // link starts from.
    clearSelection();
    refreshLibrary();
    // Before any run there's no state to take it from, so ask directly -
    // the folder is worth offering on an empty first launch too.
    window.pywebview.api.default_output_dir().then(setDestination);
  });
</script>
</body>
