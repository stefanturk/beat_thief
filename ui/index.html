<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat Thief</title>

<!--
  The window's face. Everything it can do goes through pywebview.api, which
  is gui.py's Api object - see gui.py for what each call does.

  Designed as a piece of hardware rather than a web page: this sits open next
  to Ableton, so it borrows a sampler's vocabulary - silkscreen section
  labels, pads that light when armed, one big readout. Set in Avenir Next,
  which is round and humanist where a monospace would be square, and which
  ships with macOS so nothing is ever fetched over the network.

  The readout is the point of the whole app. While a run is going it shows
  progress; when it finishes it shows the tempo that got baked into the
  filename, big enough to read across a desk and clickable to copy - because
  that number is what gets typed into Ableton next.
-->

<style>
  :root {
    --panel: #16171b;
    --raised: #1e2026;
    --edge: #2c2f37;
    --ink: #e9e7e2;
    --dim: #8b8d95;
    --violet: #a78bfa;
    --violet-dim: #38265f;
    --good: #5fd39a;
    --bad: #ff6b5e;
    --radius: 6px;

    --display: "Avenir Next", "Avenir", -apple-system, sans-serif;
    --ui: "Avenir Next", "Avenir", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: var(--panel);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  /* Silkscreen labels, the way a panel names its sections. */
  .label {
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 0 0 8px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 22px 15px;
    border-bottom: 1px solid var(--edge);
  }

  .wordmark { display: flex; align-items: center; gap: 10px; }

  h1 {
    font-family: var(--display);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.005em;
    margin: 0;
  }

  #state {
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 7px;
  }

  #led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--edge);
    flex: none;
  }
  body[data-state="running"] #led { background: var(--violet); animation: pulse 1.4s ease-in-out infinite; }
  body[data-state="done"] #led { background: var(--good); }
  body[data-state="error"] #led,
  body[data-state="cancelled"] #led { background: var(--bad); }
  body[data-state="running"] #state { color: var(--violet); }
  body[data-state="error"] #state { color: var(--bad); }

  @keyframes pulse { 50% { opacity: 0.25; } }

  main {
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    flex: 1;
  }

  input[type="url"] {
    width: 100%;
    padding: 11px 13px;
    background: #0f1013;
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: var(--display);
    font-size: 12.5px;
    user-select: text;
    cursor: text;
  }
  input[type="url"]::placeholder { color: #5b5d64; }
  input[type="url"]:focus {
    outline: none;
    border-color: var(--violet);
    box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.16);
  }

  /* Armed pads: on or off at a glance, no hunting for a tick mark. */
  .pads { display: flex; gap: 8px; }

  .pad {
    flex: 1;
    padding: 13px 6px 11px;
    background: var(--raised);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    color: var(--dim);
    font-family: var(--display);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: center;
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .pad:hover { border-color: #3d414b; }
  .pad[aria-pressed="true"] {
    background: var(--violet-dim);
    border-color: var(--violet);
    color: var(--violet);
  }
  /* Already in the stash. Not a state you can click into or out of - the
     only way to clear it is to delete the file - so it doesn't respond to
     hover and doesn't take the armed colour. */
  .pad[data-have="true"] {
    background: rgba(95, 211, 154, 0.12);
    border-color: var(--good);
    color: var(--good);
    cursor: default;
  }
  .pad:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  .extras {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    margin-top: 11px;
    font-size: 12.5px;
    color: var(--dim);
  }
  .extras label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .extras input { accent-color: var(--violet); margin: 0; }
  .extras .aside { color: #5b5d64; }

  /* The readout: progress while working, tempo when finished. */
  .readout {
    background: #0d0e11;
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    padding: 22px 18px 18px;
    text-align: center;
  }

  #figure {
    font-family: var(--display);
    font-size: 46px;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1;
    color: #4a4d55;
    font-variant-numeric: tabular-nums;
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
  }
  body[data-state="running"] #figure { color: var(--violet); }
  body[data-state="done"] #figure { color: var(--good); }
  body[data-state="error"] #figure,
  body[data-state="cancelled"] #figure { color: var(--bad); }

  #figure[data-copyable="true"] { cursor: pointer; }
  #figure[data-copyable="true"]:hover { background: rgba(95, 211, 154, 0.1); }

  #unit {
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
    margin-top: 9px;
  }

  #message {
    font-size: 12.5px;
    color: var(--dim);
    margin-top: 13px;
    min-height: 1.45em;
    word-break: break-word;
  }
  body[data-state="error"] #message { color: var(--bad); }

  .track {
    height: 3px;
    background: var(--edge);
    border-radius: 2px;
    margin-top: 14px;
    overflow: hidden;
  }
  #bar {
    height: 100%;
    width: 0;
    background: var(--violet);
    transition: width 0.25s linear;
  }
  body[data-state="done"] #bar { background: var(--good); }

  /* Two separate stalls, both measured on a real run, both of which used to
     look identical to a crash:

       - 48s between "isolating" and demucs' first percentage, which is
         torch loading and the model coming off disk. No percentage exists
         to show, so the bar was pinned at zero width the whole time.
       - 28s sitting between 61% and 63% mid-separation. The percentage is
         honest - demucs just isn't linear in time - so even a correct bar
         stops dead.

     So the bar carries a travelling sheen whenever a run is going,
     independent of its width. Movement means "alive", width means
     "progress", and they're no longer the same claim. */
  #bar::after {
    content: "";
    display: block;
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
    transform: translateX(-100%);
  }
  body[data-state="running"] #bar::after { animation: sheen 1.6s ease-in-out infinite; }

  /* With no percentage to show, the track fills itself and lets the sheen
     do all the talking rather than claiming a width it hasn't earned. */
  #bar[data-indeterminate="true"] {
    width: 100%;
    background: var(--violet-dim);
    transition: none;
  }
  #bar[data-indeterminate="true"]::after {
    background: linear-gradient(90deg, transparent, var(--violet), transparent);
    width: 40%;
  }
  body[data-state="running"] #bar[data-indeterminate="true"]::after { animation: sweep 1.5s ease-in-out infinite; }

  @keyframes sheen { to { transform: translateX(100%); } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(350%); } }

  #go {
    width: 100%;
    padding: 14px;
    background: var(--violet);
    border: none;
    border-radius: var(--radius);
    color: #14102a;
    font-family: var(--display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
  }
  #go:hover { background: #b9a1fb; }
  #go:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #go[data-mode="cancel"] {
    background: transparent;
    border: 1px solid var(--bad);
    color: var(--bad);
  }
  #go[data-mode="cancel"]:hover { background: rgba(255, 107, 94, 0.12); }
  #go:disabled { opacity: 0.45; cursor: default; }

  .files { border-top: 1px solid var(--edge); padding: 18px 22px 22px; }

  #empty { color: #5b5d64; font-size: 12.5px; margin: 0 0 12px; }

  /* Always here, whether or not this session downloaded anything. The
     folder is the one thing you always want to reach - it's where every
     previous session's work is too, and an empty list used to be a dead
     end that told you where your files were without offering to show you. */
  #destination {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    margin: 14px 0 0;
    padding: 0;
    background: none;
    border: none;
    color: #4a4d55;
    font-family: var(--display);
    font-size: 10px;
    text-align: left;
    cursor: pointer;
  }
  #destination:hover { color: var(--violet); }
  #destination:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
  #destination .where {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl;  /* keep the folder name visible when the path is long */
    text-align: left;
  }
  #destination .open {
    flex: none;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  #destination:hover .open { color: var(--violet); }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

  /* One row per song, not per file. A song's stems all live in the same
     folder and all get dragged out of it together, so the folder is the
     thing worth reaching - a list of every wav inside it was four rows of
     noise for one answer. */
  .song {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--raised);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
  }
  .song:hover { border-color: #3d414b; }

  .song-open {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 9px;
    background: none;
    border: none;
    padding: 0;
    color: var(--ink);
    font-family: var(--display);
    font-size: 11.5px;
    text-align: left;
    cursor: pointer;
  }
  .song-open:hover .song-title { color: var(--violet); }
  .song-open:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }

  .song-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .song-meta {
    flex: none;
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  /* The same six things as the Take section, in the same order, so a
     glance down the list and a glance up at the pads mean the same thing.
     Green is in the stash; clicking one reveals that exact file. */
  .marks { display: flex; gap: 3px; flex: none; }
  .mark {
    width: 13px;
    height: 13px;
    padding: 0;
    border-radius: 3px;
    background: transparent;
    border: 1px solid var(--edge);
    cursor: default;
  }
  .mark[data-have="true"] {
    background: var(--good);
    border-color: var(--good);
    cursor: pointer;
  }
  .mark[data-have="true"]:hover { background: #8ce7bd; }
  .mark:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  .again {
    flex: none;
    padding: 5px 10px;
    background: transparent;
    border: 1px solid var(--violet);
    border-radius: 4px;
    color: var(--violet);
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .again:hover { background: var(--violet-dim); }
  .again:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  /* The picker. A beat is found by ear, so this is built to be listened
     to: the waveform is there to get you near the phrase, not to be read
     precisely. Everything precise happens in the transcription after. */
  .picker {
    margin-top: 10px;
    padding: 12px;
    background: #0d0e11;
    border: 1px solid var(--edge);
    border-radius: var(--radius);
  }
  .picker[hidden] { display: none; }

  .picker-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
  }
  #picker-hint { color: #5b5d64; letter-spacing: 0.04em; text-transform: none; font-size: 11px; }

  #wave {
    display: block;
    width: 100%;
    height: 78px;
    background: #0a0b0d;
    border-radius: 4px;
    cursor: crosshair;
  }

  .picker-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .picker-controls button {
    padding: 8px 14px;
    background: var(--raised);
    border: 1px solid var(--edge);
    border-radius: 4px;
    color: var(--ink);
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .picker-controls button:hover { border-color: var(--violet); color: var(--violet); }
  .picker-controls button:disabled { opacity: 0.4; cursor: default; border-color: var(--edge); color: var(--dim); }
  #mark { border-color: var(--violet); color: var(--violet); }
  #mark:hover { background: var(--violet-dim); }

  #clock {
    margin-left: auto;
    font-family: var(--display);
    font-size: 11px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<body data-state="idle">
  <header>
    <div class="wordmark">
      <img src="logo.svg" alt="" width="26" height="26">
      <h1>Beat Thief</h1>
    </div>
    <div id="state"><span id="led"></span><span id="state-text">Ready</span></div>
  </header>

  <main>
    <section>
      <p class="label">Link</p>
      <input id="url" type="url" placeholder="paste a YouTube or YouTube Music link" spellcheck="false" autofocus>
    </section>

    <section>
      <p class="label">Take</p>
      <!--
        Six things, in the order they're shown everywhere: Song, Drums,
        Beat, Bass, Harmony, Vocals. Grey means not armed, purple means
        armed for this run, green means it's already in the stash - and
        green can only be cleared by deleting the file, never by clicking.
      -->
      <div class="pads">
        <button class="pad" id="pad-song" data-stem="song" aria-pressed="true">Song</button>
        <button class="pad" id="pad-drums" data-stem="drums" aria-pressed="false">Drums</button>
        <button class="pad" id="pad-beat" data-stem="beat" aria-pressed="false">Beat</button>
        <button class="pad" id="pad-bass" data-stem="bass" aria-pressed="false">Bass</button>
        <button class="pad" id="pad-harmony" data-stem="harmony" aria-pressed="false">Harmony</button>
        <button class="pad" id="pad-vocals" data-stem="vocals" aria-pressed="false">Vocals</button>
      </div>
      <div class="extras">
        <span class="aside" id="take-note">All four stems rebuild the song.</span>
      </div>
    </section>

    <section class="readout">
      <div id="figure" data-copyable="false">···</div>
      <div id="unit"></div>
      <p id="message">Paste a link to get started.</p>
      <div class="track"><div id="bar"></div></div>
    </section>

    <button id="go">Steal it</button>
  </main>

  <section class="files">
    <p class="label">Files</p>
    <p id="empty">Nothing yet this session.</p>
    <ul id="outputs"></ul>

    <section class="picker" id="picker" hidden>
      <div class="picker-head">
        <span id="picker-title">Steal a beat</span>
        <span id="picker-hint">Click where the phrase starts, press play, then hit space at its end.</span>
      </div>
      <canvas id="wave" width="1000" height="156"></canvas>
      <div class="picker-controls">
        <button id="play" type="button">Play</button>
        <button id="mark" type="button" disabled>Mark the end</button>
        <button id="picker-close" type="button">Close</button>
        <span id="clock">0:00</span>
      </div>
    </section>
    <button id="destination" type="button" title="Open this folder in Finder">
      <span class="where"></span><span class="open">Open</span>
    </button>
  </section>

<script>
  const el = (id) => document.getElementById(id);
  const body = document.body;

  let polling = null;
  let running = false;

  // --- reading a run's state -------------------------------------------

  // The tempo lives in the filename ("... at 121.132 BPM).wav") because that's
  // where the pipeline puts it. Pulling it back out is what lets the readout
  // finish on the number worth knowing rather than a bare "100%".
  const TEMPO = /at ([\d.]+) BPM\)/;

  function tempoOf(paths) {
    for (const path of paths) {
      const found = path.match(TEMPO);
      if (found) return found[1];
    }
    return null;
  }

  // --- painting ---------------------------------------------------------

  function setFigure(text, unit, copyable) {
    el("figure").textContent = text;
    el("figure").dataset.copyable = copyable ? "true" : "false";
    el("unit").textContent = unit;
  }

  function render(state) {
    running = state.running;
    const mode = state.error ? "error" : state.running ? "running" : state.stage;
    body.dataset.state = mode === "done" || mode === "cancelled" || mode === "error" ? mode : (state.running ? "running" : "idle");

    el("state-text").textContent = {
      running: "Working",
      done: "Done",
      error: "Stopped",
      cancelled: "Cancelled",
    }[body.dataset.state] || "Ready";

    el("message").textContent = state.error || state.message || "Paste a link to get started.";

    const percent = state.percent;
    const known = percent !== null && percent !== undefined;
    el("bar").dataset.indeterminate = state.running && !known ? "true" : "false";
    if (known) el("bar").style.width = percent + "%";
    else if (!state.running) el("bar").style.width = "0";

    if (state.running) {
      setFigure(known ? Math.round(percent) + "%" : "···", state.stage.replace(/-/g, " "), false);
    } else if (body.dataset.state === "done") {
      const tempo = tempoOf(state.outputs || []);
      if (tempo) setFigure(tempo, "BPM — click to copy", true);
      else setFigure("✓", "Finished", false);
    } else if (body.dataset.state === "error" || body.dataset.state === "cancelled") {
      setFigure("···", body.dataset.state === "cancelled" ? "Cancelled" : "Stopped", false);
    } else {
      setFigure("···", "", false);
    }

    el("go").textContent = state.running ? "Stop" : "Steal it";
    el("go").dataset.mode = state.running ? "cancel" : "go";
    if (state.output_dir) setDestination(state.output_dir);
  }

  // Songs are listed rather than loose files so "go back for another stem"
  // has something to hang off: the link belongs to the song, not to any one
  // wav it produced.
  function renderLibrary(songs) {
    const list = el("outputs");
    el("empty").hidden = songs.length > 0;
    list.replaceChildren(...songs.map(renderSong));
  }

  function renderSong(song) {
    const item = document.createElement("li");
    item.className = "song";

    const open = document.createElement("button");
    open.className = "song-open";
    open.title = "Show this song's folder in Finder";

    const title = document.createElement("span");
    title.className = "song-title";
    title.textContent = song.title;
    open.append(title);

    const tempo = tempoOf(song.files || []);
    if (tempo) {
      const meta = document.createElement("span");
      meta.className = "song-meta";
      meta.textContent = tempo + " BPM";
      open.append(meta);
    }

    open.addEventListener("click", () => window.pywebview.api.reveal(song.dir || song.song));
    item.append(open);

    // The same six squares as the Take section, in the same order.
    const marks = document.createElement("div");
    marks.className = "marks";
    for (const thing of STASH_ORDER) {
      const path = (song.have || {})[thing];
      const mark = document.createElement("button");
      mark.className = "mark";
      mark.dataset.have = path ? "true" : "false";
      mark.title = path ? LABELS[thing] + " — click to show it in Finder" : "No " + LABELS[thing].toLowerCase() + " yet";
      if (path) mark.addEventListener("click", () => window.pywebview.api.reveal(path));
      marks.append(mark);
    }
    item.append(marks);

    const take = document.createElement("button");
    take.className = "again";
    take.textContent = "Take more";
    take.title = "Point the Take section at this song";
    take.addEventListener("click", () => selectSong(song));
    item.append(take);

    return item;
  }

  // --- what's armed, and what's already in the stash ---------------------

  const STASH_ORDER = ["song", "drums", "beat", "bass", "harmony", "vocals"];
  const LABELS = {
    song: "Song", drums: "Drums", beat: "Beat",
    bass: "Bass", harmony: "Harmony", vocals: "Vocals",
  };

  // What each thing needs before it can exist. A beat is cut out of the
  // drum stem, and every stem is separated out of the song, so arming one
  // arms what it's made from.
  const NEEDS = {
    song: [],
    drums: ["song"], bass: ["song"], harmony: ["song"], vocals: ["song"],
    beat: ["song", "drums"],
  };

  let selected = null;   // the song the Take section is pointed at, if any

  function padFor(thing) { return el("pad-" + thing); }
  function isArmed(thing) { return padFor(thing).getAttribute("aria-pressed") === "true"; }
  function have(thing) { return padFor(thing).dataset.have === "true"; }

  function setArmed(thing, on) {
    // Something already in the stash is never armed - it isn't re-taken.
    padFor(thing).setAttribute("aria-pressed", on && !have(thing) ? "true" : "false");
  }

  function togglePad(thing) {
    if (have(thing)) return;               // green isn't a state you click out of
    if (isArmed(thing)) {
      setArmed(thing, false);
    } else {
      setArmed(thing, true);
      for (const needed of NEEDS[thing]) setArmed(needed, true);
    }
    describeTake();
  }

  function selectSong(song) {
    selected = song;
    el("url").value = song.title;
    for (const thing of STASH_ORDER) {
      padFor(thing).dataset.have = (song.have || {})[thing] ? "true" : "false";
      setArmed(thing, false);
    }
    describeTake();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function clearSelection() {
    selected = null;
    for (const thing of STASH_ORDER) {
      padFor(thing).dataset.have = "false";
      setArmed(thing, thing === "song");
    }
    describeTake();
  }

  function describeTake() {
    const armed = STASH_ORDER.filter(isArmed);
    el("take-note").textContent = selected
      ? (armed.length ? "Taking " + armed.map((t) => LABELS[t].toLowerCase()).join(", ") + " from " + selected.title
                      : "Nothing armed — everything for this song is already in the stash.")
      : "All four stems rebuild the song.";
  }

  let lastLibrary = null;

  function refreshLibrary() {
    return window.pywebview.api.library().then((songs) => {
      lastLibrary = songs;
      renderLibrary(songs);
      // Keep the pads honest about a song that just gained something.
      if (selected) {
        const fresh = songs.find((s) => s.song === selected.song);
        if (fresh) {
          selected = fresh;
          for (const thing of STASH_ORDER) {
            padFor(thing).dataset.have = (fresh.have || {})[thing] ? "true" : "false";
            if (have(thing)) setArmed(thing, false);
          }
          describeTake();
        }
      }
      return songs;
    });
  }

  // The path reads right-to-left (see the CSS) so that a long path gets
  // clipped at its front rather than losing the folder name at the end.
  // That flips a leading "/" to the wrong side, so the bidi marker pins it.
  function setDestination(dir) {
    el("destination").querySelector(".where").textContent = "\u202A" + dir;
    el("destination").dataset.dir = dir;
  }

  // --- the picker --------------------------------------------------------
  //
  // A beat is found by ear. The waveform gets you near the phrase; you
  // start it playing and hit space where it ends. Nothing here decides
  // anything musical - it only collects two times and hands them over.

  const wave = el("wave");
  const audio = new Audio();
  let picker = null;     // { song, peaks, duration, start, end }
  let raf = null;

  function clock(seconds) {
    if (!isFinite(seconds)) return "0:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ":" + String(s).padStart(2, "0");
  }

  function drawWave() {
    const ctx = wave.getContext("2d");
    const w = wave.width, h = wave.height;
    ctx.clearRect(0, 0, w, h);
    if (!picker) return;

    const peaks = picker.peaks;
    const mid = h / 2;
    const barW = w / peaks.length;

    // The marked region, painted behind the waveform so it reads as
    // highlight rather than as another wave.
    if (picker.start !== null) {
      const from = (picker.start / picker.duration) * w;
      const to = ((picker.end === null ? audio.currentTime : picker.end) / picker.duration) * w;
      ctx.fillStyle = "rgba(167, 139, 250, 0.16)";
      ctx.fillRect(Math.min(from, to), 0, Math.abs(to - from), h);
    }

    ctx.fillStyle = "#3d414b";
    for (let i = 0; i < peaks.length; i++) {
      const bar = Math.max(1, peaks[i] * (h * 0.86));
      ctx.fillRect(i * barW, mid - bar / 2, Math.max(1, barW - 0.5), bar);
    }

    for (const [time, colour] of [[picker.start, "#a78bfa"], [picker.end, "#5fd39a"]]) {
      if (time === null) continue;
      const x = (time / picker.duration) * w;
      ctx.fillStyle = colour;
      ctx.fillRect(x - 1, 0, 2, h);
    }

    if (!audio.paused) {
      const x = (audio.currentTime / picker.duration) * w;
      ctx.fillStyle = "#e9e7e2";
      ctx.fillRect(x - 0.5, 0, 1, h);
    }
  }

  function tick() {
    if (!picker) return;
    el("clock").textContent = clock(audio.currentTime) + " / " + clock(picker.duration);
    drawWave();
    raf = requestAnimationFrame(tick);
  }

  function openPicker(song) {
    closePicker();
    el("picker").hidden = false;
    // The link box has focus at this point - it's autofocused on load, and
    // it's where a link was just typed or a song's name was just put. Space
    // typed into a text box is a space, so the keydown handler below has to
    // ignore it there, which left the whole interaction dead: the picker
    // open, the hint saying "hit space", and space doing nothing. Letting it
    // go is the fix; from here the page's only job is listening.
    el("url").blur();
    el("picker-title").textContent = song.title;
    el("picker-hint").textContent = "Getting the audio...";

    window.pywebview.api.audition(song.have.drums).then((prepared) => {
      if (prepared.error) { el("picker-hint").textContent = prepared.error; return; }
      picker = { song, peaks: prepared.peaks, duration: prepared.duration, start: null, end: null };
      el("picker-hint").textContent = "Click where the phrase starts, press play, then hit space at its end.";
      audio.src = prepared.audio;
      // An mp3 can't be seeked until it's playable, so a click before this
      // fires would silently land at zero.
      audio.addEventListener("canplay", () => { el("play").disabled = false; }, { once: true });
      el("play").disabled = true;
      drawWave();
    });
  }

  function closePicker() {
    audio.pause();
    audio.removeAttribute("src");
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    picker = null;
    el("picker").hidden = true;
    el("play").textContent = "Play";
    el("mark").disabled = true;
  }

  function seekFromClick(event) {
    if (!picker) return;
    const box = wave.getBoundingClientRect();
    const at = ((event.clientX - box.left) / box.width) * picker.duration;
    picker.start = Math.max(0, Math.min(at, picker.duration));
    picker.end = null;
    audio.currentTime = picker.start;
    el("mark").disabled = false;
    drawWave();
  }

  function markEnd() {
    if (!picker || picker.start === null) return;
    const end = audio.currentTime;
    if (end <= picker.start) { el("picker-hint").textContent = "That is before the start - click again and play on."; return; }
    picker.end = end;
    audio.pause();
    el("play").textContent = "Play";
    el("picker-hint").textContent = "Stealing it...";
    el("mark").disabled = true;
    drawWave();

    window.pywebview.api.steal_beat(picker.song.have.drums, picker.start, end).then((loop) => {
      el("mark").disabled = false;
      if (loop.error) { el("picker-hint").textContent = loop.error; return; }
      el("picker-hint").textContent =
        loop.bars + " bar" + (loop.bars === 1 ? "" : "s") + ", " + loop.hits + " hits, " +
        loop.pieces.join(" / ") + " — set Ableton to " + loop.tempo + " BPM";
      refreshLibrary();
    });
  }

  // --- talking to Python -------------------------------------------------

  function poll() {
    window.pywebview.api.status().then((state) => {
      render(state);
      if (!state.running && polling) {
        clearInterval(polling);
        polling = null;
        refreshLibrary().then(() => {
          // The drums are there now, so the phrase can be picked.
          const waiting = pendingBeatFor;
          pendingBeatFor = null;
          if (waiting && !state.error && !state.cancelled) {
            const fresh = songWaitedFor(waiting, state);
            if (fresh && fresh.have && fresh.have.drums) openPicker(fresh);
            else el("message").textContent =
              "There's no drum stem to pick a beat out of — arm Drums and take it again.";
          }
        });
      }
    });
  }

  function start() {
    const options = {};
    for (const thing of STASH_ORDER) options[thing] = isArmed(thing);

    // "Beat" isn't something a run can produce - it needs you to hear the
    // phrase - so it's dropped from what's asked for and remembered as
    // what to do once the drums exist.
    const wantsBeat = options.beat;
    delete options.beat;

    if (selected) {
      // "source", not "song": every other key here is an armed/not flag,
      // and one of the squares is called Song.
      options.source = selected.song;
      // Nothing left to separate: go straight to the picker.
      if (wantsBeat && !options.drums && selected.have && selected.have.drums) {
        openPicker(selected);
        return;
      }
    }
    // Remembered as a path rather than as the song object, because a link
    // that hasn't been downloaded yet has no song object to remember - and
    // that's the ordinary case: paste a link, click Beat, take it.
    pendingBeatFor = wantsBeat ? { song: selected ? selected.song : "" } : null;

    window.pywebview.api.start(el("url").value, options).then((state) => {
      render(state);
      if (state.running && !polling) polling = setInterval(poll, 250);
    }).catch(complain);
  }

  // A call into Python that raises rejects the promise, and a rejection
  // nobody catches is silent - the button looks broken and the page says
  // "Ready". Anything that goes wrong across the bridge gets said out loud.
  function complain(problem) {
    body.dataset.state = "error";
    el("state-text").textContent = "Stopped";
    el("message").textContent = String(problem && problem.message || problem);
    setFigure("···", "Stopped", false);
  }

  window.addEventListener("unhandledrejection", (event) => complain(event.reason));

  // A song whose beat was armed, waiting for its drums to finish.
  let pendingBeatFor = null;

  // Which song that run was about. A song picked out of the stash is known
  // by its path from the start; a freshly downloaded one isn't known until
  // it exists, so it's recognised by the run's own outputs - and failing
  // that, by being the newest thing in the stash, which it is.
  function songWaitedFor(waiting, state) {
    const songs = lastLibrary || [];
    if (waiting.song) return songs.find((s) => s.song === waiting.song);
    const outputs = state.outputs || [];
    return songs.find((s) => outputs.includes(s.song)) || songs[0];
  }

  // --- wiring ------------------------------------------------------------

  document.querySelectorAll(".pad").forEach((pad) => {
    pad.addEventListener("click", () => togglePad(pad.dataset.stem));
  });

  // Typing a link is starting over on a new song, so the stash colours from
  // whatever was selected before don't apply any more.
  el("url").addEventListener("input", () => { if (selected) clearSelection(); });

  el("go").addEventListener("click", () => {
    if (running) window.pywebview.api.cancel().then(render);
    else start();
  });

  el("url").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !running) start();
  });

  el("figure").addEventListener("click", () => {
    if (el("figure").dataset.copyable !== "true") return;
    const tempo = el("figure").textContent;
    // A file:// page can't rely on the async clipboard API, so go through a
    // throwaway textarea - the copy is the whole point of showing the number.
    const scratch = document.createElement("textarea");
    scratch.value = tempo;
    document.body.append(scratch);
    scratch.select();
    document.execCommand("copy");
    scratch.remove();
    el("unit").textContent = "BPM — copied";
  });

  el("destination").addEventListener("click", () => {
    window.pywebview.api.open_output_dir(el("destination").dataset.dir || "");
  });

  wave.addEventListener("click", seekFromClick);
  el("picker-close").addEventListener("click", closePicker);

  el("play").addEventListener("click", () => {
    if (!picker) return;
    if (audio.paused) {
      audio.play();
      el("play").textContent = "Pause";
      if (!raf) tick();
    } else {
      audio.pause();
      el("play").textContent = "Play";
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      drawWave();
    }
  });

  el("mark").addEventListener("click", markEnd);

  // Space marks the end, which is the whole interaction - but only while
  // the picker is open, and never while a link is being typed into the box.
  document.addEventListener("keydown", (event) => {
    if (event.code !== "Space" || el("picker").hidden) return;
    // Somewhere you can type is the one place a space is a space.
    const typing = document.activeElement;
    if (typing && (typing.tagName === "INPUT" || typing.tagName === "TEXTAREA")) return;
    // Stops a space from also pressing whatever button was last clicked.
    event.preventDefault();
    markEnd();
  });

  window.addEventListener("pywebviewready", () => {
    poll();
    // Song armed, nothing green, nothing selected - the state a pasted
    // link starts from.
    clearSelection();
    refreshLibrary();
    // Before any run there's no state to take it from, so ask directly -
    // the folder is worth offering on an empty first launch too.
    window.pywebview.api.default_output_dir().then(setDestination);
  });
</script>
</body>
